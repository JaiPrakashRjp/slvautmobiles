# PROD — port 80 → gunicorn :8000
server {
    listen 80;
    server_name 187.127.186.206 srv1782538.hstgr.cloud;

    client_max_body_size 20M;

    # Hosted PROD APK for in-app updates (auto-uploaded by the build workflow).
    location /app/ {
        alias /var/www/slv-apk/prod/;
        default_type application/vnd.android.package-archive;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# DEV — port 8080 → gunicorn :8001
# Dev APK connects to http://187.127.186.206:8080
server {
    listen 8080;
    server_name 187.127.186.206;

    client_max_body_size 20M;

    # Hosted DEV APK (auto-uploaded by the build workflow on dev pushes).
    location /app/ {
        alias /var/www/slv-apk/dev/;
        default_type application/vnd.android.package-archive;
    }

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
