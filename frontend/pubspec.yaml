name: slv_auto_consultant
description: "SLV Auto Consultant — internal business app for three-wheeler auto-rickshaw operations."
publish_to: "none"
version: 0.2.28+39

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.0               # REST calls to the FastAPI backend
  http_parser: ^4.0.2        # MediaType for multipart document uploads
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  intl: ^0.19.0              # Indian number/date formatting (₹1,80,000, dd MMM yyyy)
  image_picker: ^1.1.2       # KYC document upload (Aadhaar/DL/PAN/photo)
  cached_network_image: ^3.4.1 # disk-cache profile pics/documents (load once)
  flutter_cache_manager: ^3.4.1 # disk-cache document bytes (preview/share)
  file_picker: ^8.0.0        # Document upload (pdf/png/heic/jpg/jpeg)
  url_launcher: ^6.3.0       # WhatsApp / SMS / phone deep links
  pdf: ^3.11.0               # Invoice + NOC generation
  printing: ^5.13.0          # PDF preview + share
  share_plus: ^10.0.0        # share documents (images/PDFs) via the OS share sheet
  package_info_plus: ^8.0.0  # read the installed app version (update check)
  flutter_local_notifications: ^17.2.4  # System tray push notifications
  firebase_core: ^3.6.0      # Firebase init (required by FCM)
  firebase_messaging: ^15.1.3 # FCM push — notifications when the app is closed
  # Firebase (add in Phase 7, not now):
  # firebase_core: ^3.6.0
  # cloud_firestore: ^5.4.0
  # firebase_auth: ^5.3.0
  # firebase_storage: ^12.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1   # generates the Android launcher icon
  flutter_test:
    sdk: flutter

# App launcher icon — regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/SLV logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/SLV logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
