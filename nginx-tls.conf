# ─────────────────────────────────────────────────────────────────────────────
# HTTPS nginx config for the SLV API. Apply AFTER obtaining a certificate
# (see TLS-SETUP.md). Replaces nginx.conf once TLS is live.
#
# Domain: srv1782538.hstgr.cloud (the VPS's Hostinger hostname, which resolves
# to this server). Swap in your own domain everywhere below if you point one at
# the box — just re-run certbot for that name.
# ─────────────────────────────────────────────────────────────────────────────

# ── PROD: redirect all plain HTTP → HTTPS ────────────────────────────────────
server {
    listen 80;
    server_name srv1782538.hstgr.cloud 187.127.186.206;

    # Let's Encrypt HTTP-01 renewal challenges must stay reachable over :80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── PROD: HTTPS :443 → gunicorn :8000 ────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name srv1782538.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/srv1782538.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1782538.hstgr.cloud/privkey.pem;
    # Mozilla "intermediate" baseline (certbot also drops options-ssl-nginx.conf).
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── DEV: HTTPS :8443 → gunicorn :8001 ────────────────────────────────────────
# Dev shares the same certificate (same hostname). Point the dev APK at
# https://srv1782538.hstgr.cloud:8443. The old cleartext :8080 block is dropped;
# re-add it only if a dev client genuinely can't use HTTPS yet.
server {
    listen 8443 ssl;
    http2 on;
    server_name srv1782538.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/srv1782538.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1782538.hstgr.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
