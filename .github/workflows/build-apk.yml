name: Build APK

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve API URL
        id: api
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [[ "${{ github.ref_name }}" == v* ]]; then
            echo "url=http://${{ secrets.SERVER_HOST }}"       >> $GITHUB_OUTPUT
            echo "label=prod"                                  >> $GITHUB_OUTPUT
          else
            echo "url=http://${{ secrets.SERVER_HOST }}:8080"  >> $GITHUB_OUTPUT
            echo "label=dev"                                   >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build release APK
        working-directory: frontend
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.api.outputs.url }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: slv-auto-${{ steps.api.outputs.label }}-${{ github.ref_name }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Auto-publish to the server so the in-app "Download update" works ──
      - name: Prepare APK as latest.apk
        run: cp frontend/build/app/outputs/flutter-apk/app-release.apk
             frontend/build/app/outputs/flutter-apk/latest.apk

      - name: Publish APK to server (${{ steps.api.outputs.label }})
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: frontend/build/app/outputs/flutter-apk/latest.apk
          target: /var/www/slv-apk/${{ steps.api.outputs.label }}/
          strip_components: 5

      - name: Create GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
          name: SLV Auto ${{ github.ref_name }}
