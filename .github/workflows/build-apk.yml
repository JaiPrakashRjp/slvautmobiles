name: Build APK & Deploy Backend

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve API URL
        id: api
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [[ "${{ github.ref_name }}" == v* ]]; then
            echo "url=http://187.127.186.206"                  >> $GITHUB_OUTPUT
            echo "label=prod"                                  >> $GITHUB_OUTPUT
          else
            echo "url=http://187.127.186.206:8080"             >> $GITHUB_OUTPUT
            echo "label=dev"                                   >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Set up release signing
        working-directory: frontend/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — release will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/slv-release.p12
          cat > key.properties <<EOF
          storeFile=slv-release.p12
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          echo "Release signing configured (persistent keystore)."

      - name: Build release APK
        working-directory: frontend
        run: |
          flutter build apk --release \
            --flavor ${{ steps.api.outputs.label }} \
            --dart-define=API_BASE_URL=${{ steps.api.outputs.url }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: slv-auto-${{ steps.api.outputs.label }}-${{ github.ref_name }}
          path: frontend/build/app/outputs/flutter-apk/app-${{ steps.api.outputs.label }}-release.apk
          retention-days: 30

      # ── Auto-publish to the server so the in-app "Download update" works ──
      # Flavored builds emit app-<flavor>-release.apk (flavor == label).
      - name: Prepare APK as latest.apk
        run: cp frontend/build/app/outputs/flutter-apk/app-${{ steps.api.outputs.label }}-release.apk
             frontend/build/app/outputs/flutter-apk/latest.apk

      - name: Publish APK to server (${{ steps.api.outputs.label }})
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: frontend/build/app/outputs/flutter-apk/latest.apk
          target: /var/www/slv-apk/${{ steps.api.outputs.label }}/
          strip_components: 5

      - name: Create GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/app-${{ steps.api.outputs.label }}-release.apk
          name: SLV Auto ${{ github.ref_name }}

  # ── Deploy the backend ONLY AFTER the APK is published. This flips
  #    LATEST_VERSION, which drives the in-app update card — so the card can
  #    never appear before the matching latest.apk is on the server. Skipped on
  #    tag pushes (those just build + create a release). ──
  deploy:
    needs: build
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/opt/slv"         >> $GITHUB_OUTPUT
            echo "service=slv-api"      >> $GITHUB_OUTPUT
            echo "branch=main"          >> $GITHUB_OUTPUT
          else
            echo "dir=/opt/slv-dev"     >> $GITHUB_OUTPUT
            echo "service=slv-api-dev"  >> $GITHUB_OUTPUT
            echo "branch=dev"           >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ${{ steps.env.outputs.dir }}

            git pull origin ${{ steps.env.outputs.branch }}

            source venv/bin/activate
            pip install -r backend/requirements.txt

            cd backend
            alembic upgrade head
            cd ..

            systemctl restart ${{ steps.env.outputs.service }}

            echo "Deployed branch=${{ steps.env.outputs.branch }} → ${{ steps.env.outputs.dir }}"
